<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS | 未来视界 - 下一代数字引擎</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* --- CSS 变量定义 --- */
        :root {
            --primary-color: #00f2fe; /* 核心青色光 */
            --secondary-color: #4facfe; /* 辅助蓝色光 */
            --accent-color: #f093fb; /* 紫色点缀 */
            --bg-dark: #050505; /* 深邃黑背景 */
            --bg-card: rgba(255, 255, 255, 0.05); /* 毛玻璃背景色 */
            --text-light: #ffffff;
            --text-gray: #a0a0a0;
            --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- 全局重置 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            line-height: 1.6;
        }

        a { text-decoration: none; color: inherit; transition: 0.3s; }

        /* --- 动态背景 Canvas --- */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* 置于最底层 */
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
        }

        /* --- 导航栏 (Header) --- */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 1.5rem 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            /* 毛玻璃效果 */
            backdrop-filter: blur(10px);
            background: rgba(5, 5, 5, 0.6);
            border-bottom: var(--glass-border);
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            /* 文字渐变流光效果 */
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 3rem;
        }

        .nav-links a {
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        /* 导航链接下划线动画 */
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-color);
            transition: width 0.3s ease;
        }
        .nav-links a:hover::after { width: 100%; }
        .nav-links a:hover { color: var(--primary-color); }


        /* --- 主视觉区域 (Hero Section) --- */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 0 10%;
            position: relative;
        }

        /* 入场动画 */
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUpAnim 1s ease forwards;
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }

        @keyframes fadeUpAnim {
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .highlight-text {
            background: linear-gradient(45deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 打字机效果光标 */
        .typewriter-text {
            font-size: 1.5rem;
            color: var(--text-gray);
            margin-bottom: 3rem;
            font-family: 'Courier New', monospace; /* 使用等宽字体增强科技感 */
            border-right: 2px solid var(--primary-color);
            white-space: nowrap;
            overflow: hidden;
            animation: blinkCursor 0.7s steps(40) infinite normal;
        }
        @keyframes blinkCursor { 
            from { border-right-color: var(--primary-color); }
            to { border-right-color: transparent; }
        }

        /* 科技感按钮 */
        .btn {
            padding: 1rem 2.5rem;
            background: transparent;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: var(--primary-color);
            z-index: -1;
            transition: all 0.4s ease;
            transform: skewX(-20deg);
        }

        .btn:hover { color: var(--bg-dark); box-shadow: 0 0 20px rgba(0, 242, 254, 0.5); }
        .btn:hover::before { width: 120%; }


        /* --- 核心特性区域 (Features) --- */
        .features-section {
            padding: 5rem 10%;
            position: relative;
            z-index: 2;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 4rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2.5rem;
        }

        /* 毛玻璃卡片样式 */
        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: var(--glass-border);
            padding: 3rem;
            border-radius: 20px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        /* 卡片悬停光效 */
        .glass-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.1);
            border-color: rgba(0, 242, 254, 0.4);
        }

        /* 卡片内部流光装饰 */
        .glass-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent, rgba(0, 242, 254, 0.1), transparent 30%);
            animation: rotateHighlight 4s linear infinite;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .glass-card:hover::after { opacity: 1; }
        @keyframes rotateHighlight { 100% { transform: rotate(1turn); } }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            color: var(--primary-color);
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        
        .glass-card h3 { font-size: 1.5rem; margin-bottom: 1rem; }
        .glass-card p { color: var(--text-gray); }

        /* --- Footer --- */
        footer {
            text-align: center;
            padding: 2rem;
            background: rgba(5, 5, 5, 0.8);
            border-top: var(--glass-border);
            color: var(--text-gray);
            font-size: 0.9rem;
        }

        /* --- 响应式适配 --- */
        @media (max-width: 768px) {
            header { padding: 1.5rem 5%; }
            .nav-links { display: none; } /* 手机端简化隐藏导航 */
            .hero h1 { font-size: 3.5rem; }
            .hero { padding: 0 5%; }
            .typewriter-text { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <header>
        <div class="logo">NEXUS AI</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#home">首页</a></li>
                <li><a href="#features">核心技术</a></li>
                <li><a href="#vision">愿景</a></li>
                <li><a href="#contact">联系我们</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1 class="fade-up">重构你的<br><span class="highlight-text">数字边界</span></h1>
        <p class="typewriter-text fade-up delay-1" id="typing-text"></p>
        <button class="btn fade-up delay-2">启动引擎 →</button>
    </section>

    <section class="features-section" id="features">
        <h2 class="section-title fade-up">核心驱动引擎</h2>
        <div class="grid-container">
            <div class="glass-card fade-up delay-1">
                <div class="card-icon">❖</div>
                <h3>量子计算架构</h3>
                <p>突破硅基极限，利用量子叠加态实现指数级算力飞跃，为AI模型提供无限可能。</p>
            </div>
            <div class="glass-card fade-up delay-2">
                <div class="card-icon">◈</div>
                <h3>神经网络矩阵</h3>
                <p>自适应深度学习算法，模仿人脑神经元连接，实现真正意义上的机器认知与决策。</p>
            </div>
            <div class="glass-card fade-up delay-3">
                <div class="card-icon">▣</div>
                <h3>全息数据接口</h3>
                <p>打破虚实界限，通过高维数据可视化与交互技术，让你触碰数据流动的脉搏。</p>
            </div>
        </div>
    </section>

    <footer>
        <p>© 2025 NEXUS Future Tech. All rights reserved. | 设计驱动未来</p>
    </footer>


    <script>
        // --- 1. 打字机效果脚本 ---
        const text = "搭载下一代神经拟态网络，连接物理与数字世界的桥梁。";
        const typingElement = document.getElementById('typing-text');
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                typingElement.textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, 50); // 打字速度
            }
        }
        // 页面加载完成后开始打字
        window.onload = typeWriter;


        // --- 2. 动态粒子背景脚本 (Canvas Animation) ---
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particlesArray;

        // 设置 Canvas 尺寸为全屏
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // 处理窗口大小调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        // 鼠标交互位置
        let mouse = {
            x: null,
            y: null,
            radius: (canvas.height/80) * (canvas.width/80)
        }

        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        // 鼠标移出后清除位置，避免粒子聚集在边缘
        window.addEventListener('mouseout', () => {
            mouse.x = undefined; mouse.y = undefined;
        });

        // 粒子类定义
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }
            // 绘制单个粒子
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
                // 使用径向渐变让粒子看起来发光
                let gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 2);
                gradient.addColorStop(0, 'rgba(0, 242, 254, 1)'); // 核心亮青色
                gradient.addColorStop(1, 'rgba(0, 242, 254, 0)'); // 边缘透明
                ctx.fillStyle = gradient;
                ctx.fill();
            }
            // 更新粒子位置和状态
            update() {
                // 边界反弹检测
                if (this.x > canvas.width || this.x < 0) this.directionX = -this.directionX;
                if (this.y > canvas.height || this.y < 0) this.directionY = -this.directionY;

                // 鼠标排斥效果
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx*dx + dy*dy);
                if (distance < mouse.radius + this.size) {
                    if (mouse.x < this.x && this.x < canvas.width - this.size * 10) this.x += 2;
                    if (mouse.x > this.x && this.x > this.size * 10) this.x -= 2;
                    if (mouse.y < this.y && this.y < canvas.height - this.size * 10) this.y += 2;
                    if (mouse.y > this.y && this.y > this.size * 10) this.y -= 2;
                }

                // 移动粒子
                this.x += this.directionX;
                this.y += this.directionY;
                this.draw();
            }
        }

        // 初始化粒子群
        function init() {
            particlesArray = [];
            let numberOfParticles = (canvas.height * canvas.width) / 9000; // 根据屏幕密度调整粒子数量
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 2) + 1;
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                // 随机速度和方向
                let directionX = (Math.random() * 1) - 0.5;
                let directionY = (Math.random() * 1) - 0.5;
                let color = '#00f2fe';
                particlesArray.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // 动画循环：连接粒子并更新
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
            }
            connect();
        }

        // 绘制粒子之间的连线
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x))
                    + ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    
                    // 如果两个粒子距离足够近，则绘制连线
                    if (distance < (canvas.width/7) * (canvas.height/7)) {
                        opacityValue = 1 - (distance/20000);
                        // 线条颜色为青色，透明度随距离变化
                        ctx.strokeStyle = 'rgba(0, 242, 254,' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // 启动
        init();
        animate();

    </script>
</body>
</html>
